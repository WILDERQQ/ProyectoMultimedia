<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtro de Detección de Bordes (Sobel 3x3)</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
</head>
<body>

    <h2 class="main-title">b: Filtro de Detección de Bordes (Sobel 3x3)</h2>

    <div class="main-layout">
        <div class="controls-panel">
            <input type="file" id="fileUpload" accept="image/*" style="display:none;">
            <button id="btnUpload" class="btn-primary">subir imagen</button>
            <hr>
            <button id="btnBordes" class="btn-action">Filtro Sobel 3x3</button>
        </div>

        <div class="canvas-box">
            <h4>original</h4>
            <canvas id="canvas1"></canvas>
        </div>

        <div class="canvas-box">
            <h4>procesado</h4>
            <canvas id="canvas2"></canvas>
        </div>
    </div>

    <script type="py" src="filtro-bordes.py" config='{"packages": ["pillow", "numpy"]}'></script>
</body>
</html>
