<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visor 3D · GLB Viewer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0f;
      color: #e2e8f0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: linear-gradient(180deg, rgba(10,10,15,0.95) 0%, transparent 100%);
      backdrop-filter: blur(4px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.5px;
      color: #c084fc;
    }

    .brand svg { width: 22px; height: 22px; }

    .file-name {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 400;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 4px 12px;
      border-radius: 20px;
    }

    /* ── CANVAS WRAPPER ── */
    #canvas-container {
      position: absolute;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* ── LOADING OVERLAY ── */
    #loading {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      gap: 24px;
      transition: opacity 0.6s ease;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner-ring {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 3px solid rgba(192,132,252,0.15);
      border-top-color: #c084fc;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 14px;
      color: #94a3b8;
      font-weight: 400;
      letter-spacing: 0.3px;
    }

    .progress-bar-wrap {
      width: 200px;
      height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      overflow: hidden;
    }

    #progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #818cf8, #c084fc);
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    /* ── CONTROLS PANEL ── */
    #controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15,15,25,0.75);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 40px;
      padding: 8px 16px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    .ctrl-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: #cbd5e1;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 14px;
    }

    .ctrl-btn:hover {
      background: rgba(192,132,252,0.2);
      border-color: rgba(192,132,252,0.4);
      color: #c084fc;
      transform: translateY(-1px);
    }

    .ctrl-btn.active {
      background: rgba(192,132,252,0.25);
      border-color: #c084fc;
      color: #e9d5ff;
    }

    .ctrl-divider {
      width: 1px;
      height: 20px;
      background: rgba(255,255,255,0.1);
      margin: 0 4px;
    }

    .ctrl-label {
      font-size: 11px;
      color: #64748b;
      padding: 0 4px;
      user-select: none;
    }

    /* ── INFO PANEL ── */
    #info {
      position: absolute;
      top: 70px;
      right: 20px;
      z-index: 10;
      background: rgba(15,15,25,0.75);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 16px 18px;
      backdrop-filter: blur(12px);
      font-size: 12px;
      color: #64748b;
      line-height: 1.9;
      min-width: 160px;
    }

    #info strong { color: #94a3b8; display: block; margin-bottom: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; }

    .info-row { display: flex; justify-content: space-between; gap: 12px; }
    .info-val { color: #c084fc; font-weight: 500; }

    /* ── ERROR ── */
    #error {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 30;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      background: #0a0a0f;
      color: #f87171;
    }
    #error.show { display: flex; }
    #error p { font-size: 14px; color: #94a3b8; max-width: 340px; text-align: center; }
  </style>
</head>
<body>

<!-- LOADING -->
<div id="loading">
  <div class="spinner-ring"></div>
  <div class="progress-bar-wrap"><div id="progress-bar"></div></div>
  <div class="loading-text">Cargando modelo…</div>
</div>

<!-- ERROR -->
<div id="error">
  <svg width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="#f87171" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/></svg>
  <strong style="font-size:16px;color:#f87171">Error al cargar</strong>
  <p id="error-msg">No se pudo cargar el archivo GLB. Asegúrate de abrirlo desde un servidor local.</p>
</div>

<!-- HEADER -->
<header>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
    </svg>
    Visor 3D
  </div>
  <span class="file-name" id="file-label">3DModel.glb</span>
</header>

<!-- CANVAS -->
<div id="canvas-container"></div>

<!-- INFO PANEL -->
<div id="info">
  <strong>Información</strong>
  <div class="info-row"><span>Vértices</span><span class="info-val" id="v-count">—</span></div>
  <div class="info-row"><span>Triángulos</span><span class="info-val" id="t-count">—</span></div>
  <div class="info-row"><span>Mallas</span><span class="info-val" id="m-count">—</span></div>
</div>

<!-- CONTROLS -->
<div id="controls">
  <span class="ctrl-label">Vista</span>
  <button class="ctrl-btn" id="btn-front" title="Frente">↑</button>
  <button class="ctrl-btn" id="btn-top" title="Superior">⊙</button>
  <button class="ctrl-btn" id="btn-side" title="Lateral">→</button>
  <div class="ctrl-divider"></div>
  <button class="ctrl-btn" id="btn-reset" title="Resetear cámara">⌖</button>
  <button class="ctrl-btn" id="btn-wire" title="Wireframe">⬡</button>
  <button class="ctrl-btn" id="btn-auto" title="Rotación automática" id="btn-auto">↻</button>
  <div class="ctrl-divider"></div>
  <button class="ctrl-btn" id="btn-bg" title="Cambiar fondo">◑</button>
</div>

<!-- Three.js CDN -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

// ── SCENE SETUP ──
const container = document.getElementById('canvas-container');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0d18);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 1000);
camera.position.set(3, 2, 5);

// ── CONTROLS ──
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.enableDamping = true;
orbit.dampingFactor = 0.07;
orbit.minDistance = 0.1;
orbit.maxDistance = 500;
orbit.autoRotate = false;
orbit.autoRotateSpeed = 1.2;

// ── LIGHTS ──
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
dirLight.position.set(5, 8, 5);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
dirLight.shadow.camera.near = 0.1;
dirLight.shadow.camera.far = 100;
scene.add(dirLight);

const fillLight = new THREE.DirectionalLight(0x8b5cf6, 0.8);
fillLight.position.set(-5, 3, -3);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0x60a5fa, 0.5);
rimLight.position.set(0, -3, -5);
scene.add(rimLight);

// ── GRID ──
const grid = new THREE.GridHelper(30, 30, 0x1e1e2e, 0x16162a);
grid.material.opacity = 0.5;
grid.material.transparent = true;
scene.add(grid);

// ── STATE ──
let modelRoot = null;
let wireframe = false;
let originalMaterials = [];
const bgStates = ['#0d0d18', '#111827', '#1a0a2e', '#0a1a2e', '#ffffff'];
let bgIdx = 0;

// ── LOAD MODEL ──
const loader = new GLTFLoader();
const progressBar = document.getElementById('progress-bar');
const loadingEl = document.getElementById('loading');

loader.load(
  '3DModel.glb',
  (gltf) => {
    modelRoot = gltf.scene;
    modelRoot.traverse(child => {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
      }
    });

    // Auto-center & scale
    const box = new THREE.Box3().setFromObject(modelRoot);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const scale = 3 / maxDim;
    modelRoot.scale.setScalar(scale);
    modelRoot.position.sub(center.multiplyScalar(scale));

    scene.add(modelRoot);

    // Reposition grid
    const box2 = new THREE.Box3().setFromObject(modelRoot);
    grid.position.y = box2.min.y;

    // Camera fit
    fitCamera(box2);

    // Stats
    updateStats();

    // Hide loading
    progressBar.style.width = '100%';
    setTimeout(() => loadingEl.classList.add('hidden'), 400);
  },
  (xhr) => {
    if (xhr.lengthComputable) {
      const pct = (xhr.loaded / xhr.total) * 100;
      progressBar.style.width = pct + '%';
      document.querySelector('.loading-text').textContent =
        `Cargando… ${Math.round(pct)}%`;
    }
  },
  (err) => {
    console.error(err);
    loadingEl.classList.add('hidden');
    const errEl = document.getElementById('error');
    errEl.classList.add('show');
    document.getElementById('error-msg').textContent =
      `Error: ${err.message || 'Archivo no encontrado. Usa un servidor local (npx serve .) para abrir este archivo.'}`;
  }
);

function fitCamera(box) {
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const fov = camera.fov * (Math.PI / 180);
  let dist = maxDim / (2 * Math.tan(fov / 2));
  dist *= 1.8;
  camera.position.set(center.x + dist * 0.6, center.y + dist * 0.5, center.z + dist);
  orbit.target.copy(center);
  camera.near = dist * 0.01;
  camera.far = dist * 20;
  camera.updateProjectionMatrix();
  orbit.update();
}

function updateStats() {
  let verts = 0, tris = 0, meshes = 0;
  modelRoot.traverse(child => {
    if (child.isMesh && child.geometry) {
      meshes++;
      const pos = child.geometry.attributes.position;
      if (pos) verts += pos.count;
      const idx = child.geometry.index;
      tris += idx ? idx.count / 3 : pos ? pos.count / 3 : 0;
    }
  });
  document.getElementById('v-count').textContent = verts.toLocaleString();
  document.getElementById('t-count').textContent = Math.round(tris).toLocaleString();
  document.getElementById('m-count').textContent = meshes.toLocaleString();
}

// ── BUTTONS ──
document.getElementById('btn-reset').addEventListener('click', () => {
  if (!modelRoot) return;
  const box = new THREE.Box3().setFromObject(modelRoot);
  fitCamera(box);
});

document.getElementById('btn-wire').addEventListener('click', () => {
  if (!modelRoot) return;
  wireframe = !wireframe;
  document.getElementById('btn-wire').classList.toggle('active', wireframe);
  modelRoot.traverse(child => {
    if (child.isMesh) {
      if (Array.isArray(child.material)) {
        child.material.forEach(m => { m.wireframe = wireframe; });
      } else {
        child.material.wireframe = wireframe;
      }
    }
  });
});

document.getElementById('btn-auto').addEventListener('click', () => {
  orbit.autoRotate = !orbit.autoRotate;
  document.getElementById('btn-auto').classList.toggle('active', orbit.autoRotate);
});

document.getElementById('btn-bg').addEventListener('click', () => {
  bgIdx = (bgIdx + 1) % bgStates.length;
  const col = bgStates[bgIdx];
  scene.background = new THREE.Color(col);
});

// View presets
document.getElementById('btn-front').addEventListener('click', () => {
  if (!modelRoot) return;
  const box = new THREE.Box3().setFromObject(modelRoot);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const dist = Math.max(size.x, size.y, size.z) * 1.8;
  camera.position.set(center.x, center.y, center.z + dist);
  orbit.target.copy(center);
  orbit.update();
});

document.getElementById('btn-top').addEventListener('click', () => {
  if (!modelRoot) return;
  const box = new THREE.Box3().setFromObject(modelRoot);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const dist = Math.max(size.x, size.z) * 2;
  camera.position.set(center.x, center.y + dist, center.z);
  orbit.target.copy(center);
  orbit.update();
});

document.getElementById('btn-side').addEventListener('click', () => {
  if (!modelRoot) return;
  const box = new THREE.Box3().setFromObject(modelRoot);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const dist = Math.max(size.y, size.z) * 1.8;
  camera.position.set(center.x + dist, center.y, center.z);
  orbit.target.copy(center);
  orbit.update();
});

// ── RESIZE ──
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ── RENDER LOOP ──
function animate() {
  requestAnimationFrame(animate);
  orbit.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
